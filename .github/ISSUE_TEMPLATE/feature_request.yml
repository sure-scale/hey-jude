name: Feature request
description: Propose new functionality or a behavior change
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: checkboxes
    id: privacy-impact
    attributes:
      label: Privacy impact
      options:
        - label: This touches anonymization, the safety net, mapping, routing, or audit logging
